<?php

require_once "../koneksi.php";

$pesan = "";

// HAPUS DATA SURVEY
if (isset($_GET['delete']) && is_numeric($_GET['delete'])) {
    $id_jawaban = (int) $_GET['delete'];
    
    $stmt = mysqli_prepare($koneksi, "SELECT id_responden FROM survey_jawaban WHERE id_jawaban = ?");
    mysqli_stmt_bind_param($stmt, "i", $id_jawaban);
    mysqli_stmt_execute($stmt);
    $resultDelete = mysqli_stmt_get_result($stmt);
    $dataDelete = mysqli_fetch_assoc($resultDelete);
    mysqli_stmt_close($stmt);

    if ($dataDelete) {
        $id_responden = (int) $dataDelete['id_responden'];
        
        $stmt = mysqli_prepare($koneksi, "DELETE FROM survey_jawaban WHERE id_jawaban = ?");
        mysqli_stmt_bind_param($stmt, "i", $id_jawaban);
        mysqli_stmt_execute($stmt);
        mysqli_stmt_close($stmt);

        $stmt = mysqli_prepare($koneksi, "DELETE FROM responden WHERE id_responden = ?");
        mysqli_stmt_bind_param($stmt, "i", $id_responden);
        mysqli_stmt_execute($stmt);
        mysqli_stmt_close($stmt);
    }

    header("Location: responses.php?msg=deleted");
    exit;
}

// UPDATE DATA SURVEY
if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['edit_id'])) {
    $edit_id = (int) $_POST['edit_id'];
    $id_responden = (int) $_POST['edit_responden_id'];

    $nama = trim($_POST['nama'] ?? '');
    $umur = (int) ($_POST['umur'] ?? 0);
    $jenis_kelamin = trim($_POST['jenis_kelamin'] ?? '');
    $pekerjaan = trim($_POST['pekerjaan'] ?? '');
    $platform_utama = trim($_POST['platform_utama'] ?? '');
    $durasi_harian = trim($_POST['durasi_harian'] ?? '');
    $tujuan_utama = trim($_POST['tujuan_utama'] ?? '');
    $frekuensi = trim($_POST['frekuensi'] ?? '');
    $bantu_informasi = trim($_POST['bantu_informasi'] ?? '');
    $ganggu_produktivitas = trim($_POST['ganggu_produktivitas'] ?? '');
    $pengaruh_kehidupan = trim($_POST['pengaruh_kehidupan'] ?? '');
    $saran = trim($_POST['saran'] ?? '');

    // Update responden
    $stmt = mysqli_prepare($koneksi, "UPDATE responden SET nama=?, umur=?, jenis_kelamin=?, pekerjaan=? WHERE id_responden=?");
    mysqli_stmt_bind_param($stmt, "sissi", $nama, $umur, $jenis_kelamin, $pekerjaan, $id_responden);
    mysqli_stmt_execute($stmt);
    mysqli_stmt_close($stmt);

    // Update survey
    $stmt = mysqli_prepare($koneksi, "UPDATE survey_jawaban SET platform_utama=?, durasi_harian=?, tujuan_utama=?, frekuensi=?, bantu_informasi=?, ganggu_produktivitas=?, pengaruh_kehidupan=?, saran=? WHERE id_jawaban=?");
    mysqli_stmt_bind_param($stmt, "ssssssssi", $platform_utama, $durasi_harian, $tujuan_utama, $frekuensi, $bantu_informasi, $ganggu_produktivitas, $pengaruh_kehidupan, $saran, $edit_id);
    mysqli_stmt_execute($stmt);
    mysqli_stmt_close($stmt);

    header("Location: responses.php?msg=updated");
    exit;
}

// PAGINATION
$page = isset($_GET['page']) && is_numeric($_GET['page']) ? (int) $_GET['page'] : 1;
$page = max(1, $page);
$limit = 10;
$offset = ($page - 1) * $limit;

// TOTAL DATA
$countQuery = mysqli_query($koneksi, "SELECT COUNT(*) AS total FROM survey_jawaban s INNER JOIN responden r ON s.id_responden = r.id_responden");
$total = (int) mysqli_fetch_assoc($countQuery)['total'];
$totalPages = max(1, ceil($total / $limit));

// DATA SURVEY
$query = "SELECT s.*, r.nama, r.umur, r.jenis_kelamin, r.pekerjaan FROM survey_jawaban s INNER JOIN responden r ON s.id_responden = r.id_responden ORDER BY s.created_at DESC LIMIT $offset, $limit";
$result = mysqli_query($koneksi, $query);

// DATA UNTUK EDIT
$editData = null;
if (isset($_GET['edit']) && is_numeric($_GET['edit'])) {
    $editId = (int) $_GET['edit'];
    $stmt = mysqli_prepare($koneksi, "SELECT s.*, r.nama, r.umur, r.jenis_kelamin, r.pekerjaan FROM survey_jawaban s INNER JOIN responden r ON s.id_responden = r.id_responden WHERE s.id_jawaban = ?");
    mysqli_stmt_bind_param($stmt, "i", $editId);
    mysqli_stmt_execute($stmt);
    $editResult = mysqli_stmt_get_result($stmt);
    $editData = mysqli_fetch_assoc($editResult);
    mysqli_stmt_close($stmt);
}
