<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Respons Survey | Admin Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout admin-hidden">
<div class="container-fluid"><div class="row">
<aside class="col-lg-2 admin-sidebar" id="sidebar"></aside>
<main class="col-lg-10 admin-content">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <div><h1 class="fw-bold mb-1">Respons Survey</h1><p class="muted mb-0">Lihat, edit, hapus, dan export data respons survey.</p></div>
  <button class="btn btn-outline-primary" id="btnExport"><i class="bi bi-download me-2"></i>Export CSV</button>
</div>
<div id="pesan"></div>
<div class="data-panel">
  <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Data Respons</h2><span class="muted small" id="total"></span></div>
  <div class="table-responsive"><table class="table table-hover align-middle">
    <thead><tr><th>Nama</th><th>Umur</th><th>JK</th><th>Pekerjaan</th><th>Platform</th><th>Durasi</th><th>Dampak</th><th>Tanggal</th><th class="text-end">Aksi</th></tr></thead>
    <tbody id="rows"><tr><td colspan="9" class="text-center text-muted py-4">Memuat...</td></tr></tbody>
  </table></div>
  <nav class="d-flex justify-content-end mt-3"><ul class="pagination mb-0" id="pager"></ul></nav>
</div>
<div class="modal fade" id="editModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable">
  <form class="modal-content" id="editForm">
    <div class="modal-header"><h2 class="modal-title h5">Edit Respons Survey</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3" id="editFields"></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
      <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Simpan Perubahan</button></div>
  </form></div></div>
</main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-responses.js"></script>
</body>
</html>
