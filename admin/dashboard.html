<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Admin Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout admin-hidden">
<div class="container-fluid"><div class="row">
<aside class="col-lg-2 admin-sidebar" id="sidebar"></aside>
<main class="col-lg-10 admin-content">
<h1 class="fw-bold mb-1">Dashboard</h1>
<p class="muted mb-4">Ringkasan data survey terbaru.</p>
<div class="row g-3 mb-4">
  <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Total Responden</div><div class="stat-value" id="sTotal">-</div></div></div>
  <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Laki-laki</div><div class="stat-value" id="sL">-</div></div></div>
  <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Perempuan</div><div class="stat-value" id="sP">-</div></div></div>
  <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Platform Terpopuler</div><div class="stat-value fs-4" id="sPlat">-</div></div></div>
</div>
<div class="data-panel">
  <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Response Terbaru</h2><span class="badge badge-soft">6 Terbaru</span></div>
  <div class="table-responsive"><table class="table table-hover">
    <thead><tr><th>Nama</th><th>Jenis Kelamin</th><th>Platform</th><th>Durasi</th><th>Dampak</th><th>Tanggal</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="text-center text-muted py-4">Memuat...</td></tr></tbody>
  </table></div>
</div>
</main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
