<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galeri | Admin Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout admin-hidden">
<div class="container-fluid"><div class="row">
<aside class="col-lg-2 admin-sidebar" id="sidebar"></aside>
<main class="col-lg-10 admin-content">
<h1 class="fw-bold mb-1">Kelola Galeri</h1>
<p class="muted mb-4">Tambah, edit, atau hapus foto galeri.</p>
<div id="pesan"></div>
<div class="data-panel mb-4">
  <h2 class="h5 fw-bold mb-3" id="formTitle">Tambah Galeri</h2>
  <form id="form"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Judul <span class="text-danger">*</span></label><input type="text" id="judul" class="form-control" maxlength="200" required></div>
    <div class="col-md-6"><label class="form-label">Deskripsi</label><input type="text" id="deskripsi" class="form-control" maxlength="1000"></div>
    <div class="col-12"><label class="form-label" id="lblGambar">Gambar <span class="text-danger">*</span></label>
      <input type="file" id="gambar" class="form-control" accept=".jpg,.jpeg,.png,.webp,.gif"><small class="text-muted">JPG, PNG, WEBP, GIF. Maksimal 5 MB.</small>
      <div id="preview"></div></div>
    <div class="col-12"><button type="submit" class="btn btn-primary" id="btnSave"><i class="bi bi-save me-2"></i>Upload</button>
      <button type="button" class="btn btn-secondary d-none" id="btnCancel">Batal</button></div>
  </div></form>
</div>
<div class="data-panel">
  <div class="d-flex justify-content-between mb-3"><h2 class="h5 fw-bold mb-0">Daftar Galeri</h2><span class="badge bg-primary" id="total">0 Foto</span></div>
  <div class="row g-3" id="list"></div>
</div>
</main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-galeri.js"></script>
</body>
</html>
