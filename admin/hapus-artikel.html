<?php
session_start();

if (!isset($_SESSION['admin_login']) || $_SESSION['admin_login'] !== true) {
    header("Location: ../login.php");
    exit;
}

require_once "../koneksi.php";

if (isset($_GET['id']) && is_numeric($_GET['id'])) {
    $id = (int) $_GET['id'];
    
    // Ambil nama file untuk dihapus dari server
    $query = mysqli_query($koneksi, "SELECT file FROM artikel WHERE id_artikel = $id");
    $row = mysqli_fetch_assoc($query);
    
    if ($row && $row['file']) {
        $filePath = "../uploads/artikel/" . $row['file'];
        if (file_exists($filePath)) {
            unlink($filePath);
        }
    }
    
    // Hapus dari database
    mysqli_query($koneksi, "DELETE FROM artikel WHERE id_artikel = $id");
}

header("Location: panduan.php?msg=deleted");
exit;
?>
