<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pesan Masuk | Admin Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout admin-hidden">
<div class="container-fluid"><div class="row">
<aside class="col-lg-2 admin-sidebar" id="sidebar"></aside>
<main class="col-lg-10 admin-content">
<h1 class="fw-bold mb-1">Pesan Masuk</h1>
<p class="muted mb-4">Lihat dan kelola pesan dari pengguna.</p>
<div id="pesan"></div>
<div class="data-panel">
  <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Daftar Pesan</h2><span class="badge bg-primary" id="total">0 Pesan</span></div>
  <div class="table-responsive"><table class="table table-hover align-middle">
    <thead><tr><th>No</th><th>Nama</th><th>Email</th><th>Subjek</th><th>Status</th><th>Tanggal</th><th class="text-end">Aksi</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="text-center text-muted py-4">Memuat...</td></tr></tbody>
  </table></div>
</div>
<div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Detail Pesan</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="detailBody"></div>
  <div class="modal-footer">
    <a class="btn btn-outline-primary me-auto" id="btnMail" href="#"><i class="bi bi-reply me-1"></i>Balas via Email</a>
    <button type="button" class="btn btn-success" id="btnReplied"><i class="bi bi-check2-all me-1"></i>Tandai Dibalas</button>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
  </div></div></div></div>
</main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-kontak.js"></script>
</body>
</html>
