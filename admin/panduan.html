<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kelola Artikel | Admin Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout admin-hidden">
<div class="container-fluid"><div class="row">
<aside class="col-lg-2 admin-sidebar" id="sidebar"></aside>
<main class="col-lg-10 admin-content">
<h1 class="fw-bold mb-1">Kelola Materi &amp; Referensi</h1>
<p class="muted mb-4">Tambahkan link artikel atau upload dokumen untuk ditampilkan kepada pengguna.</p>
<div id="pesan"></div>
<div class="data-panel mb-4">
  <h2 class="h5 fw-bold mb-3">Tambah Materi / Referensi</h2>
  <form id="form">
    <div class="mb-3"><label class="form-label">Judul</label><input type="text" id="judul" class="form-control" maxlength="200" placeholder="Contoh: Panduan Pengisian Survey" required></div>
    <div class="mb-3"><label class="form-label">Jenis</label>
      <select id="tipe" class="form-select" required><option value="">-- Pilih Jenis --</option><option value="link">Link / URL</option><option value="file">Upload File</option></select></div>
    <div class="mb-3 d-none" id="bagianLink"><label class="form-label">Link / URL</label><input type="url" id="link" class="form-control" placeholder="https://contoh.com/artikel"></div>
    <div class="mb-3 d-none" id="bagianFile"><label class="form-label">Pilih File</label>
      <input type="file" id="file" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx">
      <small class="text-muted">Format: PDF, DOC, DOCX, PPT, PPTX, XLS, XLSX. Maksimal 10 MB.</small></div>
    <button type="submit" class="btn btn-primary" id="btnSave"><i class="bi bi-plus-circle me-2"></i>Tambah</button>
  </form>
</div>
<div class="data-panel">
  <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Daftar Materi &amp; Referensi</h2><span class="badge bg-primary" id="total">0 Item</span></div>
  <div class="table-responsive"><table class="table table-hover align-middle">
    <thead><tr><th>No</th><th>Judul</th><th>Jenis</th><th>Aksi</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
</div>
</main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-panduan.js"></script>
</body>
</html>
