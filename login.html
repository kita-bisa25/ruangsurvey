<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Admin | Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/public.css" rel="stylesheet">
</head>
<body class="auth-page" data-page="login">
<main class="container">
    <div class="auth-box mx-auto">
        <a href="index.html" class="navbar-brand fw-bold d-inline-flex align-items-center mb-4" style="color:#087f79;font-size:22px">
            <img src="assets/foto/logo.png" alt="RS" style="height:40px;margin-right:10px">Ruang Survey
        </a>
        <h1 class="h3 fw-bold">Login Admin</h1>
        <p class="text-muted">Masuk untuk mengelola data survey.</p>
        <div id="pesan"></div>
        <form id="formLogin" class="mt-4">
            <div class="mb-3"><label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" placeholder="admin@contoh.com" required autocomplete="username"></div>
            <div class="mb-3"><label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" placeholder="Masukkan password" required autocomplete="current-password"></div>
            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
